<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoGuard AI Prevention Advisor</title>

    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         CSS
    ====================================================== -->

    <style>

        /* =================================================
           GLOBAL
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #72ff68;
            --green-2: #a8ff78;
            --cyan: #36f5d0;

            --dark: #01110e;
            --dark-2: #02241d;

            --white: #ffffff;
            --muted: #b8d3cc;

            --glass: rgba(3, 42, 35, 0.72);

            --border: rgba(100, 255, 170, 0.40);
        }


        body {

            min-height: 100vh;

            font-family: "Inter", sans-serif;

            color: var(--white);

            overflow-x: hidden;

            background:

                radial-gradient(
                    circle at 85% 10%,
                    rgba(90, 255, 120, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 10% 90%,
                    rgba(0, 240, 190, 0.15),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #010b09,
                    #01221b 50%,
                    #001511
                );

            position: relative;
        }


        /* =================================================
           CINEMATIC BACKGROUND
        ================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            z-index: -3;

            background:

                linear-gradient(
                    rgba(0, 15, 12, 0.30),
                    rgba(0, 12, 10, 0.78)
                );

            pointer-events: none;
        }


        /* Large atmospheric glow */

        body::after {

            content: "";

            position: fixed;

            width: 650px;
            height: 650px;

            right: -250px;
            top: -250px;

            border-radius: 50%;

            background: rgba(85, 255, 110, 0.16);

            filter: blur(130px);

            z-index: -2;

            animation: backgroundGlow 8s ease-in-out infinite alternate;
        }


        @keyframes backgroundGlow {

            0% {
                transform: translate(0, 0) scale(1);
                opacity: .45;
            }

            100% {
                transform: translate(-100px, 100px) scale(1.2);
                opacity: .9;
            }
        }


        /* =================================================
           FLOATING PARTICLES
        ================================================= */

        .particles {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -1;

            overflow: hidden;
        }


        .particle {

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);

            opacity: .5;

            animation: particleMove linear infinite;
        }


        .particle:nth-child(1) {
            left: 8%;
            animation-duration: 12s;
            animation-delay: 1s;
        }

        .particle:nth-child(2) {
            left: 20%;
            animation-duration: 17s;
            animation-delay: 3s;
        }

        .particle:nth-child(3) {
            left: 35%;
            animation-duration: 14s;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            left: 52%;
            animation-duration: 19s;
            animation-delay: 4s;
        }

        .particle:nth-child(5) {
            left: 70%;
            animation-duration: 15s;
            animation-delay: 1s;
        }

        .particle:nth-child(6) {
            left: 87%;
            animation-duration: 18s;
            animation-delay: 5s;
        }


        @keyframes particleMove {

            0% {
                top: 110%;
                transform: translateX(0);
                opacity: 0;
            }

            20% {
                opacity: .5;
            }

            80% {
                opacity: .5;
            }

            100% {
                top: -10%;
                transform: translateX(80px);
                opacity: 0;
            }
        }


        /* =================================================
           MAIN CARD
        ================================================= */

        .ai-advisor {

            width: min(1120px, 92%);

            margin: 70px auto;

            padding: 48px;

            position: relative;

            border-radius: 32px;

            background:

                linear-gradient(
                    135deg,
                    rgba(7, 66, 54, .78),
                    rgba(2, 29, 25, .78)
                );

            border: 1px solid var(--border);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:

                0 30px 100px rgba(0, 0, 0, .65),

                0 0 80px rgba(80, 255, 130, .10);

            overflow: hidden;
        }


        /* Animated shine */

        .ai-advisor::before {

            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            top: -300px;
            left: -200px;

            background: rgba(100, 255, 130, .10);

            border-radius: 50%;

            filter: blur(80px);

            animation: cardGlow 7s ease-in-out infinite alternate;
        }


        @keyframes cardGlow {

            to {
                transform: translate(800px, 500px);
            }
        }


        /* =================================================
           HEADER
        ================================================= */

        .advisor-heading {

            display: flex;

            align-items: flex-start;

            gap: 18px;

            position: relative;

            z-index: 2;

            margin-bottom: 42px;
        }


        .robot-icon {

            width: 60px;
            height: 60px;

            flex-shrink: 0;

            display: grid;

            place-items: center;

            border-radius: 18px;

            font-size: 29px;

            background:

                linear-gradient(
                    145deg,
                    rgba(100, 255, 120, .22),
                    rgba(0, 255, 200, .07)
                );

            border: 1px solid rgba(100, 255, 150, .45);

            box-shadow:

                0 0 30px rgba(100, 255, 120, .18);

            animation: robotPulse 3s ease-in-out infinite;
        }


        @keyframes robotPulse {

            0%,100% {
                box-shadow:
                    0 0 20px rgba(100,255,120,.12);
            }

            50% {
                box-shadow:
                    0 0 40px rgba(100,255,120,.35);
            }
        }


        .section-tag {

            color: var(--green);

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 10px;
        }


        .advisor-heading h1 {

            font-family: "Space Grotesk", sans-serif;

            font-size: clamp(32px, 5vw, 52px);

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 14px;
        }


        .ai-text {

            color: var(--green);

            text-shadow:
                0 0 20px rgba(100, 255, 100, .4);
        }


        .description {

            color: var(--muted);

            font-size: 16px;

            line-height: 1.7;

            max-width: 800px;
        }


        /* =================================================
           CONTENT
        ================================================= */

        .advisor-content {

            display: grid;

            grid-template-columns: 1.35fr .65fr;

            gap: 40px;

            position: relative;

            z-index: 2;
        }


        /* =================================================
           FORM
        ================================================= */

        .form-area {

            padding-right: 20px;
        }


        .form-group {

            margin-bottom: 25px;
        }


        label {

            display: block;

            color: #eafff2;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 10px;
        }


        select,
        textarea {

            width: 100%;

            border: 1px solid rgba(90, 255, 170, .35);

            border-radius: 16px;

            background: rgba(0, 15, 13, .65);

            color: white;

            outline: none;

            font-family: "Inter", sans-serif;

            transition: .3s ease;
        }


        select {

            height: 58px;

            padding: 0 18px;

            font-size: 15px;

            cursor: pointer;
        }


        textarea {

            min-height: 155px;

            padding: 18px;

            resize: vertical;

            font-size: 15px;

            line-height: 1.7;
        }


        textarea::placeholder {

            color: #76968f;
        }


        select:focus,
        textarea:focus {

            border-color: var(--green);

            box-shadow:

                0 0 0 3px rgba(100,255,100,.08),

                0 0 30px rgba(70,255,150,.13);
        }


        /* =================================================
           AI STATUS
        ================================================= */

        .ai-status {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-top: 12px;

            color: #8eaea6;

            font-size: 12px;
        }


        .status-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);

            animation: statusBlink 1.5s infinite;
        }


        @keyframes statusBlink {

            50% {
                opacity: .25;
            }
        }


        /* =================================================
           INNOVATIVE BUTTON
        ================================================= */

        .main-btn {

            width: 330px;

            max-width: 100%;

            height: 66px;

            border: 1px solid rgba(200,255,170,.7);

            border-radius: 50px;

            padding: 6px 7px 6px 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            cursor: pointer;

            font-family: "Space Grotesk", sans-serif;

            font-size: 16px;

            font-weight: 700;

            color: #05200f;

            background:

                linear-gradient(
                    100deg,
                    #4cff6c,
                    #b0ff7c,
                    #43f5bd
                );

            box-shadow:

                0 0 25px rgba(80,255,100,.25),

                0 12px 30px rgba(0,0,0,.35);

            position: relative;

            overflow: hidden;

            transition: .35s ease;
        }


        .main-btn::before {

            content: "";

            position: absolute;

            width: 80px;
            height: 180px;

            left: -120px;
            top: -60px;

            background: rgba(255,255,255,.7);

            transform: rotate(25deg);

            filter: blur(15px);

            transition: .7s ease;
        }


        .main-btn:hover {

            transform: translateY(-4px) scale(1.02);

            box-shadow:

                0 0 45px rgba(80,255,100,.42),

                0 18px 40px rgba(0,0,0,.4);
        }


        .main-btn:hover::before {

            left: 120%;
        }


        .button-text {

            position: relative;

            z-index: 2;
        }


        .button-arrow {

            width: 52px;
            height: 52px;

            border-radius: 50%;

            display: grid;

            place-items: center;

            background: #06392d;

            color: white;

            font-size: 25px;

            position: relative;

            z-index: 2;

            transition: .35s ease;
        }


        .main-btn:hover .button-arrow {

            transform: rotate(-45deg);

            background: #021f18;
        }


        /* =================================================
           ECO VISUAL
        ================================================= */

        .eco-visual {

            min-height: 390px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            border-left: 1px solid rgba(100,255,180,.16);
        }


        .eco-title {

            position: absolute;

            top: 15px;

            text-align: center;

            color: var(--green-2);

            font-family: "Space Grotesk", sans-serif;

            font-size: 18px;

            line-height: 1.3;

            text-shadow:
                0 0 15px rgba(100,255,100,.45);
        }


        .eco-title strong {

            display: block;

            color: white;

            font-size: 27px;
        }


        /* =================================================
           EARTH
        ================================================= */

        .earth-glow {

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background: rgba(80,255,100,.17);

            filter: blur(55px);

            animation: earthGlow 3s ease-in-out infinite;
        }


        @keyframes earthGlow {

            0%,100% {
                transform: scale(.9);
                opacity: .5;
            }

            50% {
                transform: scale(1.15);
                opacity: .9;
            }
        }


        .earth {

            width: 185px;
            height: 185px;

            border-radius: 50%;

            position: relative;

            z-index: 2;

            background:

                radial-gradient(
                    circle at 32% 27%,
                    #b8ff83,
                    #42ce76 22%,
                    #087e70 52%,
                    #033c42 73%,
                    #001916 100%
                );

            box-shadow:

                inset -28px -25px 45px rgba(0,0,0,.62),

                inset 15px 12px 30px rgba(170,255,130,.35),

                0 0 35px rgba(80,255,100,.5);

            animation: earthFloat 5s ease-in-out infinite;
        }


        @keyframes earthFloat {

            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-14px);
            }
        }


        /* Earth detail */

        .earth::before {

            content: "🌍";

            position: absolute;

            inset: 0;

            display: grid;

            place-items: center;

            font-size: 150px;

            filter:
                saturate(1.25)
                drop-shadow(0 0 12px rgba(100,255,100,.3));

            opacity: .88;
        }


        /* =================================================
           ORBIT
        ================================================= */

        .orbit {

            position: absolute;

            width: 285px;

            height: 90px;

            border-radius: 50%;

            border: 2px solid rgba(120,255,100,.65);

            transform: rotate(-15deg);

            box-shadow:

                0 0 15px rgba(80,255,100,.3);

            z-index: 3;

            animation: orbitRotate 7s linear infinite;
        }


        @keyframes orbitRotate {

            from {
                transform: rotate(-15deg);
            }

            to {
                transform: rotate(345deg);
            }
        }


        /* =================================================
           FLOATING LEAVES
        ================================================= */

        .leaf {

            position: absolute;

            font-size: 27px;

            z-index: 4;

            filter:
                drop-shadow(0 0 10px rgba(100,255,100,.6));

            animation: leafFloat 4s ease-in-out infinite;
        }


        .leaf-1 {
            top: 80px;
            right: 35px;
        }


        .leaf-2 {
            bottom: 70px;
            left: 30px;

            animation-delay: 1s;
        }


        .leaf-3 {
            top: 155px;
            left: 20px;

            animation-delay: 2s;
        }


        @keyframes leafFloat {

            0%,100% {
                transform: translateY(0) rotate(0);
            }

            50% {
                transform: translateY(-15px) rotate(12deg);
            }
        }


        /* =================================================
           LOADING
        ================================================= */

        .loading {

            display: flex;

            align-items: center;

            gap: 12px;

            color: var(--green);

            padding: 15px 0;

            font-size: 14px;
        }


        .loading-dots {

            display: flex;

            gap: 5px;
        }


        .loading-dots span {

            width: 6px;
            height: 6px;

            background: var(--green);

            border-radius: 50%;

            animation: loadingDots 1s infinite;
        }


        .loading-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: .3s;
        }


        @keyframes loadingDots {

            0%,100% {
                opacity: .2;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }


        /* =================================================
           RESULT
        ================================================= */

        .advisor-result {

            margin-top: 35px;

            padding: 28px;

            border-radius: 20px;

            background: rgba(0,20,16,.75);

            border: 1px solid rgba(80,255,150,.3);

            border-left: 4px solid var(--green);

            position: relative;

            z-index: 4;

            animation: resultIn .5s ease;
        }


        @keyframes resultIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .advisor-result h2 {

            color: var(--green);

            font-family: "Space Grotesk", sans-serif;

            margin-bottom: 18px;
        }


        .advisor-result p {

            color: var(--muted);

            line-height: 1.8;

            margin-bottom: 12px;
        }


        .advisor-result ul {

            padding-left: 22px;

            margin: 15px 0;
        }


        .advisor-result li {

            color: var(--muted);

            line-height: 1.8;

            margin-bottom: 7px;
        }


        .advisor-note {

            color: var(--green-2) !important;

            font-size: 13px;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media(max-width: 850px) {

            .ai-advisor {

                margin: 25px auto;

                padding: 30px 22px;
            }


            .advisor-content {

                grid-template-columns: 1fr;
            }


            .form-area {

                padding-right: 0;
            }


            .eco-visual {

                border-left: none;

                border-top: 1px solid rgba(100,255,180,.16);

                margin-top: 15px;

                padding-top: 25px;
            }
        }


        @media(max-width: 550px) {

            .advisor-heading {

                gap: 12px;
            }


            .robot-icon {

                width: 48px;
                height: 48px;

                font-size: 22px;
            }


            .advisor-heading h1 {

                font-size: 30px;

                letter-spacing: -1px;
            }


            .section-tag {

                font-size: 9px;

                letter-spacing: 2px;
            }


            .description {

                font-size: 14px;
            }


            .main-btn {

                width: 100%;
            }


            .eco-visual {

                min-height: 330px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     FLOATING PARTICLES
====================================================== -->

<div class="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

</div>



<!-- =====================================================
     MAIN AI ADVISOR
====================================================== -->

<section class="ai-advisor">


    <!-- HEADER -->

    <div class="advisor-heading">


        <div class="robot-icon">
            🤖
        </div>


        <div>

            <p class="section-tag">
                PERSONALISE​D GUIDANCE
            </p>


            <h1>
                EcoGuard
                <span class="ai-text">AI</span>
                Prevention Advisor
            </h1>


            <p class="description">

                Tell us about an emission source and get
                practical ideas to reduce it.

            </p>

        </div>

    </div>



    <!-- CONTENT -->

    <div class="advisor-content">


        <!-- =================================================
             FORM
        ================================================== -->

        <div class="form-area">


            <form id="carbonAdvisorForm">


                <div class="form-group">

                    <label for="emissionSource">
                        Main emission source
                    </label>


                    <select
                        id="emissionSource"
                        required
                    >

                        <option value="transport">
                            🚗 Transport / vehicles
                        </option>

                        <option value="electricity">
                            ⚡ Home electricity
                        </option>

                        <option value="waste">
                            ♻️ Waste and plastic
                        </option>

                        <option value="food">
                            🌱 Food and agriculture
                        </option>

                        <option value="industry">
                            🏭 Factory / industry
                        </option>

                    </select>

                </div>



                <div class="form-group">

                    <label for="carbonQuestion">
                        Describe the situation
                    </label>


                    <textarea
                        id="carbonQuestion"
                        maxlength="500"
                        placeholder="Example: I travel 20 km every day by motorbike and use air conditioning at home."
                        required
                    ></textarea>


                    <div class="ai-status">

                        <span class="status-dot"></span>

                        EcoGuard AI is ready to analyse your situation

                    </div>

                </div>



                <!-- BUTTON -->

                <button
                    class="main-btn"
                    type="submit"
                >

                    <span class="button-text">
                        ✨ Get prevention ideas
                    </span>


                    <span class="button-arrow">
                        →
                    </span>

                </button>


            </form>

        </div>



        <!-- =================================================
             ECO VISUAL
        ================================================== -->

        <div class="eco-visual">


            <div class="eco-title">

                Small changes

                <strong>
                    Big impact
                </strong>

            </div>


            <div class="earth-glow"></div>


            <div class="earth"></div>


            <div class="orbit"></div>


            <div class="leaf leaf-1">
                🍃
            </div>

            <div class="leaf leaf-2">
                🌿
            </div>

            <div class="leaf leaf-3">
                🍃
            </div>


        </div>

    </div>



    <!-- =================================================
         RESULT
    ================================================== -->

    <div
        id="advisorResult"
        class="advisor-result"
        hidden
    >

        <h2>
            🌱 Your Carbon-Reduction Plan
        </h2>


        <div id="advisorText"></div>

    </div>


</section>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("carbonAdvisorForm");

const result =
    document.getElementById("advisorResult");

const resultText =
    document.getElementById("advisorText");


/* =====================================================
   PREVENTION DATABASE
===================================================== */

const preventionIdeas = {

    transport: {

        title: "Transport Emission Reduction",

        ideas: [

            "Walk or cycle for short journeys whenever possible.",

            "Use public transport, carpooling, or combine several errands into one trip.",

            "Keep vehicle tyres correctly inflated and maintain the engine regularly.",

            "Avoid unnecessary idling because it wastes fuel.",

            "When replacing a vehicle, consider a fuel-efficient or electric option."

        ]

    },


    electricity: {

        title: "Home Electricity Reduction",

        ideas: [

            "Switch off lights, fans, chargers, and appliances when they are not being used.",

            "Replace traditional bulbs with energy-efficient LED lighting.",

            "Use energy-efficient appliances where possible.",

            "Keep air-conditioning filters clean and avoid unnecessarily low temperatures.",

            "Consider rooftop solar power if it is practical for your home."

        ]

    },


    waste: {

        title: "Waste & Plastic Reduction",

        ideas: [

            "Avoid unnecessary single-use plastic products.",

            "Carry reusable bags, bottles, and food containers.",

            "Separate recyclable, organic, and general waste.",

            "Compost suitable food waste instead of sending it to landfill.",

            "Repair, reuse, donate, or recycle products before replacing them."

        ]

    },


    food: {

        title: "Food & Agriculture Reduction",

        ideas: [

            "Include more plant-based meals in your weekly diet.",

            "Choose seasonal food when practical.",

            "Plan meals carefully to reduce food waste.",

            "Store leftovers properly so they can be used later.",

            "Compost unavoidable organic food waste where facilities are available."

        ]

    },


    industry: {

        title: "Industrial Emission Reduction",

        ideas: [

            "Measure electricity and fuel consumption to identify major emission sources.",

            "Regularly maintain motors, boilers, pumps, and industrial machinery.",

            "Improve production efficiency to reduce energy consumed per product.",

            "Consider renewable energy and waste-heat recovery where practical.",

            "Reduce material waste and recycle suitable production by-products."

        ]

    }

};



/* =====================================================
   SAFE HTML FUNCTION
===================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener("submit", function(event) {

    event.preventDefault();


    const source =
        document.getElementById("emissionSource").value;


    const situation =
        document
            .getElementById("carbonQuestion")
            .value
            .trim();


    if (!situation) {

        return;

    }


    const data =
        preventionIdeas[source];


    /* Show AI loading */

    result.hidden = false;


    resultText.innerHTML = `

        <div class="loading">

            <span>🤖 EcoGuard AI is analysing your situation</span>

            <div class="loading-dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    result.scrollIntoView({

        behavior: "smooth",

        block: "nearest"

    });


    /* Simulate AI analysis */

    setTimeout(function() {


        const safeSituation =
            escapeHTML(situation);


        resultText.innerHTML = `

            <p>

                <strong>
                    Situation analysed:
                </strong>

                ${safeSituation}

            </p>


            <p>

                <strong>
                    ${data.title}
                </strong>

            </p>


            <p>
                Based on the emission source you selected,
                EcoGuard recommends these practical actions:
            </p>


            <ul>

                ${data.ideas
                    .map(idea => `<li>${idea}</li>`)
                    .join("")}

            </ul>


            <p class="advisor-note">

                🌍 AI recommendation:
                Start with one or two changes that are
                realistic for your daily routine.
                Consistent small actions can create a
                meaningful reduction in emissions.

            </p>

        `;


    }, 1200);

});


</script>

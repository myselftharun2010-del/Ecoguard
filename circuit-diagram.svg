<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061b32"/><stop offset=".52" stop-color="#0b4262"/><stop offset="1" stop-color="#0c6d83"/></linearGradient>
    <radialGradient id="glow" cx="76%" cy="26%" r="70%"><stop stop-color="#36cfe0" stop-opacity=".28"/><stop offset="1" stop-color="#36cfe0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#b8f4f3" stroke-opacity=".1" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#001322" flood-opacity=".35"/></filter>
    <style>
      .wire{fill:none;stroke:#f4ffff;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}.symbol{fill:#103a58;stroke:#f4ffff;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}.node{fill:#ffcb55}.title{font:700 53px Arial,sans-serif;fill:#f4ffff}.label{font:700 31px Arial,sans-serif;fill:#f4ffff}.sub{font:24px Arial,sans-serif;fill:#bce4ec}.accent{font:700 23px Arial,sans-serif;fill:#ffcb55}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#glow)"/><rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M0 790 C260 670 380 930 680 820 S1170 670 1600 800 V1000 H0Z" fill="#02172b" opacity=".32"/>
  <text x="105" y="115" class="title">SUCTION MOTOR</text><text x="105" y="160" class="sub">Simple DC circuit • close the switch to run the motor</text>
  <rect x="95" y="215" width="1410" height="610" rx="36" fill="#062944" fill-opacity=".72" stroke="#6bdaea" stroke-opacity=".35" stroke-width="2" filter="url(#shadow)"/>

  <!-- circuit -->
  <path class="wire" d="M385 395 H635 M815 395 H1125 V665 H905 M665 665 H385 V535 M385 395 V440 M385 585 V665"/>
  <!-- battery -->
  <line x1="260" y1="440" x2="510" y2="440" stroke="#f4ffff" stroke-width="13"/><line x1="295" y1="585" x2="475" y2="585" stroke="#f4ffff" stroke-width="13"/>
  <text x="225" y="455" class="label" font-size="45">+</text><text x="225" y="600" class="label" font-size="45">−</text>
  <text x="385" y="745" text-anchor="middle" class="label">BATTERY</text><text x="385" y="782" text-anchor="middle" class="sub">DC power supply</text>
  <!-- switch -->
  <circle cx="635" cy="395" r="12" class="node"/><circle cx="815" cy="395" r="12" class="node"/><path d="M635 395 L782 315" fill="none" stroke="#ffcb55" stroke-width="13" stroke-linecap="round"/>
  <text x="725" y="285" text-anchor="middle" class="label">SWITCH</text><text x="725" y="330" text-anchor="middle" class="accent">OPEN</text>
  <!-- motor -->
  <circle cx="1125" cy="530" r="115" class="symbol"/><path d="M1125 415 V395 M1125 645 V665" class="wire"/>
  <text x="1125" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="95" fill="#f4ffff">M</text>
  <text x="1325" y="512" text-anchor="middle" class="label">SUCTION MOTOR</text><text x="1325" y="550" text-anchor="middle" class="sub">DC vacuum fan</text><path d="M1244 530 H1290" stroke="#6bdaea" stroke-width="3"/>
  <!-- flow -->
  <path d="M480 362 l30 33 l-30 33" fill="none" stroke="#ffcb55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="324" text-anchor="middle" class="accent">FLOW</text>
  <rect x="1035" y="870" width="470" height="70" rx="35" fill="#ffcb55"/><text x="1270" y="915" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="27" fill="#082844">CLOSE SWITCH → MOTOR RUNS</text>
</svg>